# Demo single-container process manager — FastAPI + Celery worker + bundled Redis.
# Railway exposes ONLY the web port; Redis stays loopback-only inside the container.
# Env vars (Railway dashboard / docker -e) override everything; image ships no secrets.
# The API honors $PORT (set by Railway) with a local default of 8000.
[supervisord]
nodaemon = true
logfile = /dev/stdout
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[unix_http_server]
file = /tmp/supervisor.sock

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:redis]
command = redis-server --bind 127.0.0.1 --port 6379 --appendonly no --save ""
priority = 10
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:api]
command = sh -c "exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
directory = /app
priority = 20
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:worker]
command = celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
directory = /app
priority = 20
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
